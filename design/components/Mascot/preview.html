<script>
const stage = document.querySelector('.mascot-stage');
stage.addEventListener('pointermove', (e) => {
  for (const svg of stage.querySelectorAll('.cm-mascot')) {
    const r = svg.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height * 0.58);
    const d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 260) * 3.4;
    svg.querySelector('.eyes').style.transform = `translate(${(dx / d) * k}px, ${(dy / d) * k}px)`;
  }
});
</script>
