<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found</title>
    <style type="text/css" media="screen">
      @font-face {
	font-family: "choco";
        src: url('choco.otf');
      }
      body {
	background-image: url("bg.png");
	background-repeat: repeat;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      .container { margin: 40px auto 40px auto; width: 100%; text-align: center; }

      a { color: #4183c4; text-decoration: none; }
      a:hover { text-decoration: underline; }

      h1 { font-family: "choco"; text-align: center; line-height: 60px; font-size: 180px; font-weight: 100; margin: 70px 0 40px 0; text-shadow: 0 8px 0 rgb(229,192,137); color: rgb(91,73,60)}
      p { color: rgb(243, 209, 161); margin: 40px auto; line-height: 1.6; font-size: 25px; background: rgb(91, 73, 60); border-radius: 12%/50%; padding: 6px 20px; text-align: center; display: inline-block}

      span.rotate { margin-left: 0.5em; letter-spacing: 2px; transform: rotate(90deg); display: inline-block; }

      .logo { display: inline-block; }
      .logo:hover {
	      -webkit-filter: drop-shadow(2px 2px 0 white)
		drop-shadow(-2px 2px 0 white)
		drop-shadow(2px -2px 0 white)
      		drop-shadow(-2px -2px 0 white);

	filter: drop-shadow(2px 2px 0 white) 
		drop-shadow(-2px 2px 0 white)
		drop-shadow(2px -2px 0 white)
       		drop-shadow(-2px -2px 0 white);
      }
    </style>
</head>
  <body>

    <div class="container">

	    <a href="/"><img class="logo" width="300" height="300" title="" alt="" src="logo-sad.png"></a>
      <h1>404</h1>
      <p><strong>Page not found	<span class="rotate">:(</span></strong></p>
    </div>
  </body>
</html>
